name: .NET CI

on:
  push:
    branches:
      - master
      - feature/textbee-sms-provider
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Rasel.sln

      - name: Build
        run: dotnet build Rasel.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Rasel.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
